<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Wimmboo</title>
<meta name="description" content="Wimmboo — developer portfolio">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="Wimmboo">
<meta property="og:description" content="Wimmboo — developer portfolio">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.github.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ff3355;
    --red-dim: rgba(255, 51, 85, 0.07);
    --black: #0a0a0a;
    --surface: #141414;
    --white: #f0f0f0;
    --gray: #b3b3b3;
    --gray-dim: #555555;
    --border: rgba(255, 255, 255, 0.08);
    --ease-snap: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --nav-height: 64px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* Subtle ambient glow — barely visible, adds depth */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 75% 15%, rgba(255, 51, 85, 0.035) 0%, transparent 55%);
    pointer-events: none;
    z-index: 1;
  }

  /* ── Nav ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-height);
    z-index: 30;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border-bottom: 1px solid var(--border);
  }

  .nav-inner {
    max-width: 900px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 clamp(20px, 4vw, 40px);
    gap: clamp(20px, 3vw, 32px);
    position: relative;
  }

  nav button {
    background: none;
    border: none;
    color: var(--white);
    font-family: 'Archivo Black', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 10px 0;
    opacity: 0.35;
    transition: opacity 0.2s var(--ease-out-expo);
    position: relative;
  }
  nav button.active { opacity: 1; }
  nav button:hover { opacity: 0.75; }

  nav button:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .nav-indicator {
    position: absolute;
    bottom: -1px;
    height: 2px;
    background: var(--red);
    transition: transform 0.35s var(--ease-out-expo), width 0.35s var(--ease-out-expo);
  }

  /* ── Content area ── */
  .content-area {
    position: relative;
    min-height: 100dvh;
    padding-top: var(--nav-height);
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 5;
  }

  .content {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: clamp(40px, 8vh, 80px) clamp(20px, 4vw, 40px);
  }

  /* ── Typography ── */
  .eyebrow {
    font-family: 'Archivo Black', Arial, sans-serif;
    color: var(--red);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0;
  }

  h1 {
    font-family: 'Archivo Black', Arial, sans-serif;
    font-size: clamp(32px, 5.5vw, 52px);
    text-transform: uppercase;
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    text-wrap: balance;
    opacity: 0;
  }

  .body {
    max-width: 52ch;
    color: var(--gray);
    line-height: 1.75;
    font-size: 15px;
    text-wrap: pretty;
    opacity: 0;
  }

  .body p + p { margin-top: 12px; }

  /* ── Staggered reveal ── */
  .content.reveal .eyebrow { animation: lineIn 0.5s var(--ease-out-expo) 0.1s forwards; }
  .content.reveal h1       { animation: lineIn 0.55s var(--ease-out-expo) 0.18s forwards; }
  .content.reveal .body    { animation: lineIn 0.55s var(--ease-out-expo) 0.28s forwards; }

  @keyframes lineIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Links ── */
  .link {
    color: var(--red);
    text-decoration: none;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
    transition: opacity 0.2s var(--ease-out-expo);
  }

  .link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 1px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s var(--ease-out-expo);
  }

  .link:hover { opacity: 0.8; }
  .link:hover::after { transform: scaleX(1); }

  .link:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .link-large {
    font-size: clamp(18px, 2.5vw, 24px);
    font-family: 'Archivo Black', Arial, sans-serif;
    letter-spacing: 0.02em;
    margin-top: 16px;
  }

  .link-large::after { height: 2px; bottom: -3px; }

  .arrow { font-size: 0.85em; }

  /* ── About links row ── */
  .about-links {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .discord-tag {
    font-size: 13px;
    color: var(--gray-dim);
    letter-spacing: 0.03em;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    user-select: all;
  }

  /* ── Projects ── */
  .projects-list { margin-top: 4px; }

  .project-row {
    display: flex;
    align-items: baseline;
    gap: clamp(16px, 3vw, 28px);
    padding: clamp(16px, 2.5vh, 24px) clamp(12px, 2vw, 16px);
    margin: 0 calc(-1 * clamp(12px, 2vw, 16px));
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.25s var(--ease-out-expo);
    text-decoration: none;
    color: inherit;
  }

  .project-row:first-child { border-top: 1px solid var(--border); }
  .project-row:hover { background: var(--red-dim); }

  .project-row:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: -2px;
  }

  .project-num {
    font-family: 'Archivo Black', Arial, sans-serif;
    font-size: clamp(13px, 1.5vw, 15px);
    color: var(--gray-dim);
    min-width: 28px;
    transition: color 0.25s var(--ease-out-expo);
  }
  .project-row:hover .project-num { color: var(--red); }

  .project-info { flex: 1; min-width: 0; }

  .project-name {
    font-family: 'Archivo Black', Arial, sans-serif;
    font-size: clamp(17px, 2.2vw, 22px);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.1;
    margin-bottom: 3px;
    transition: color 0.25s var(--ease-out-expo);
  }
  .project-row:hover .project-name { color: var(--red); }

  .project-desc {
    font-size: 13px;
    color: var(--gray-dim);
    line-height: 1.45;
    max-width: 48ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .project-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--gray-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .project-lang {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .lang-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .project-arrow {
    font-size: 16px;
    color: var(--gray-dim);
    transition: transform 0.25s var(--ease-out-expo), color 0.25s var(--ease-out-expo);
    flex-shrink: 0;
  }
  .project-row:hover .project-arrow {
    transform: translateX(4px);
    color: var(--red);
  }

  /* ── Skeleton loading ── */
  .skeleton-row {
    display: flex;
    align-items: baseline;
    gap: clamp(16px, 3vw, 28px);
    padding: clamp(16px, 2.5vh, 24px) clamp(12px, 2vw, 16px);
    margin: 0 calc(-1 * clamp(12px, 2vw, 16px));
    border-bottom: 1px solid var(--border);
  }
  .skeleton-row:first-child { border-top: 1px solid var(--border); }

  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, #1c1c1c 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 3px;
  }

  .skeleton-num { width: 28px; height: 15px; }
  .skeleton-info { flex: 1; }
  .skeleton-name { width: 40%; height: 20px; margin-bottom: 6px; }
  .skeleton-desc { width: 65%; height: 13px; }
  .skeleton-meta { width: 80px; height: 13px; }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── Error state ── */
  .projects-error {
    padding: 32px 0;
    text-align: center;
    color: var(--gray-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  .projects-error span {
    display: block;
    font-family: 'Archivo Black', Arial, sans-serif;
    color: var(--gray);
    font-size: 16px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ── Panels (transition wipe) ── */
  .panel {
    position: fixed;
    top: 0; left: -30%;
    width: 160%; height: 100%;
    transform: translateX(-100%);
    pointer-events: none;
  }

  .panel.black {
    background: var(--black);
    clip-path: polygon(0 0, 95% 0, 92% 100%, 0 100%);
    z-index: 40;
  }

  .panel.red {
    background: var(--red);
    clip-path: polygon(0 0, 84% 0, 80% 100%, 0 100%);
    z-index: 41;
  }

  .panel.run {
    transition: transform 0.35s var(--ease-snap);
    will-change: transform;
  }
  .panel.cover { transform: translateX(0); }
  .panel.exit  { transform: translateX(100%); }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    :root { --nav-height: 56px; }

    .nav-inner { gap: 20px; }
    nav button { font-size: 11px; padding: 8px 0; }

    .content { padding: 32px 20px 48px; }

    h1 { font-size: clamp(28px, 8vw, 36px); }

    .project-row { flex-wrap: wrap; }
    .project-meta {
      width: 100%;
      margin-top: 2px;
      padding-left: calc(28px + clamp(16px, 3vw, 28px));
    }
    .project-arrow { display: none; }
    .project-desc { white-space: normal; }

    .about-links { flex-direction: column; align-items: flex-start; gap: 12px; }
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .panel.run { transition-duration: 0.01ms !important; }
    .content.reveal .eyebrow,
    .content.reveal h1,
    .content.reveal .body {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .skeleton { animation: none; }
    .link::after { transition: none; }
    .project-row { transition: none; }
    .project-arrow { transition: none; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <button class="active" data-section="about">About me</button>
    <button data-section="projects">Projects</button>
    <button data-section="github">Github</button>
    <div class="nav-indicator" id="indicator"></div>
  </div>
</nav>

<main class="content-area">
  <div class="content" id="content"></div>
</main>

<div class="panel black" id="panelBlack"></div>
<div class="panel red" id="panelRed"></div>

<script>
  const GITHUB_USERNAME = 'Wimmboo2';
  const GITHUB_PROFILE = `https://github.com/${GITHUB_USERNAME}`;
  const PLAYLIST_URL = 'https://music.apple.com/id/playlist/atlus/pl.u-GgA5klafoJ202lq?ls';
  const PLAYLIST_URL2 = 'https://music.apple.com/id/playlist/caesar/pl.u-jV8908VCDrB9BkY';

  const langColors = {
    JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5',
    HTML: '#e34c26', CSS: '#563d7c', Java: '#b07219', 'C++': '#f34b7d',
    'C#': '#178600', Go: '#00ADD8', Rust: '#dea584', Ruby: '#701516',
    PHP: '#4F5D95', Swift: '#F05138', Kotlin: '#A97BFF', Dart: '#00B4AB',
    Vue: '#41b883', Svelte: '#ff3e00', Shell: '#89e051', Lua: '#000080',
  };

  const buttons = document.querySelectorAll('nav button');
  const indicator = document.getElementById('indicator');
  const content = document.getElementById('content');
  const panelBlack = document.getElementById('panelBlack');
  const panelRed = document.getElementById('panelRed');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STEP = reduced ? 0 : 350;
  let busy = false;
  let currentSection = 'about';

  let reposData = null;
  let reposError = null;
  let navPaddingLeft = 0;

  function escapeHTML(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function moveIndicator(btn) {
    indicator.style.width = btn.offsetWidth + 'px';
    indicator.style.transform = `translateX(${btn.offsetLeft - navPaddingLeft}px)`;
  }

  /* ── Section renderers ── */

  function renderAbout() {
    return `
      <p class="eyebrow">01 — profile</p>
      <h1>About me</h1>
      <div class="body">
        <p>hii :3 im wimmboo. i like games, music, coding and AI.</p>
        <p>i love minecraft and persona</p>
        <p>idk, that's it i guess</p>
        <div class="about-links">
          <a href="${PLAYLIST_URL}" target="_blank" rel="noopener noreferrer" class="link">My playlist(game OST) <span class="arrow">&#8599;</span></a>
          <a href="${PLAYLIST_URL2}" target="_blank" rel="noopener noreferrer" class="link">My playlist(non-game OST) <span class="arrow">&#8599;</span></a>
          <span class="discord-tag">@wimmboo</span>
        </div>
      </div>
    `;
  }

  function renderProjects() {
    return `
      <p class="eyebrow">02 — work</p>
      <h1>Projects</h1>
      <div class="projects-list" id="projectsList">${renderProjectsList()}</div>
    `;
  }

  function renderProjectsList() {
    if (reposError) {
      return `<div class="projects-error"><span>Could not load repos</span>Check your connection and try again.</div>`;
    }
    if (!reposData) {
      return renderSkeleton();
    }
    if (reposData.length === 0) {
      return `<div class="projects-error"><span>No public repos yet</span>Check back soon.</div>`;
    }
    return reposData.map((repo, i) => `
      <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="project-row">
        <span class="project-num">${String(i + 1).padStart(2, '0')}</span>
        <div class="project-info">
          <div class="project-name">${escapeHTML(repo.name)}</div>
          ${repo.description ? `<div class="project-desc">${escapeHTML(repo.description)}</div>` : ''}
        </div>
        <div class="project-meta">
          ${repo.language ? `<span class="project-lang"><span class="lang-dot" style="background:${langColors[repo.language] || '#888'}"></span>${escapeHTML(repo.language)}</span>` : ''}
          <span>&#9733; ${repo.stargazers_count}</span>
        </div>
        <span class="project-arrow">&rarr;</span>
      </a>
    `).join('');
  }

  function renderSkeleton() {
    return Array(3).fill(0).map(() => `
      <div class="skeleton-row">
        <div class="skeleton skeleton-num"></div>
        <div class="skeleton-info">
          <div class="skeleton skeleton-name"></div>
          <div class="skeleton skeleton-desc"></div>
        </div>
        <div class="skeleton skeleton-meta"></div>
      </div>
    `).join('');
  }

  function renderGithub() {
    return `
      <p class="eyebrow">03 — code</p>
      <h1>Github</h1>
      <div class="body">
        <p>All my code lives here.</p>
        <a href="${GITHUB_PROFILE}" target="_blank" rel="noopener noreferrer" class="link link-large">github.com/${GITHUB_USERNAME} <span class="arrow">&#8599;</span></a>
      </div>
    `;
  }

  const sectionRenderers = {
    about: renderAbout,
    projects: renderProjects,
    github: renderGithub,
  };

  function fillContent(key) {
    currentSection = key;
    content.innerHTML = sectionRenderers[key]();
  }

  /* ── GitHub API ── */

  async function loadRepos() {
    try {
      const res = await fetch(
        `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&direction=desc&per_page=3`
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      reposData = await res.json();
    } catch (e) {
      reposError = e.message;
    }
    if (currentSection === 'projects') {
      const list = document.getElementById('projectsList');
      if (list) list.innerHTML = renderProjectsList();
    }
  }

  /* ── Panel transitions ── */

  function transitionTo(key) {
    if (busy || key === currentSection) return;
    busy = true;

    buttons.forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`nav button[data-section="${key}"]`);
    activeBtn.classList.add('active');
    moveIndicator(activeBtn);

    // Stagger panels slightly for a chase effect
    panelRed.style.transitionDelay = '30ms';
    panelBlack.style.transitionDelay = '0ms';

    panelBlack.classList.add('run');
    panelRed.classList.add('run');

    requestAnimationFrame(() => {
      panelBlack.classList.add('cover');
      panelRed.classList.add('cover');
    });

    setTimeout(() => {
      fillContent(key);
      content.classList.remove('reveal');
      panelBlack.classList.replace('cover', 'exit');
      panelRed.classList.replace('cover', 'exit');
      requestAnimationFrame(() => content.classList.add('reveal'));
    }, STEP);

    setTimeout(() => {
      panelBlack.classList.remove('run', 'exit');
      panelRed.classList.remove('run', 'exit');
      panelBlack.style.transitionDelay = '';
      panelRed.style.transitionDelay = '';
      busy = false;
    }, STEP * 2 + 50);
  }

  /* ── Initial load: panels reveal ── */

  function initReveal() {
    fillContent('about');

    // Panels start covering the screen
    panelBlack.style.transition = 'none';
    panelRed.style.transition = 'none';
    panelBlack.classList.add('cover');
    panelRed.classList.add('cover');

    // Force reflow so the initial state is painted
    void panelBlack.offsetWidth;

    // Slide out after a brief beat
    setTimeout(() => {
      panelBlack.style.transition = '';
      panelRed.style.transition = '';
      panelBlack.classList.add('run');
      panelRed.classList.add('run');
      panelRed.style.transitionDelay = '40ms';

      requestAnimationFrame(() => {
        panelBlack.classList.replace('cover', 'exit');
        panelRed.classList.replace('cover', 'exit');
      });

      setTimeout(() => {
        content.classList.add('reveal');
      }, reduced ? 0 : 200);

      setTimeout(() => {
        panelBlack.classList.remove('run', 'exit');
        panelRed.classList.remove('run', 'exit');
        panelRed.style.transitionDelay = '';
      }, reduced ? 10 : 500);
    }, reduced ? 0 : 120);
  }

  /* ── Events ── */

  buttons.forEach(btn => {
    btn.addEventListener('click', () => transitionTo(btn.dataset.section));
  });

  function updateNavMetrics() {
    navPaddingLeft = parseFloat(getComputedStyle(document.querySelector('.nav-inner')).paddingLeft);
  }

  window.addEventListener('load', () => {
    updateNavMetrics();
    moveIndicator(document.querySelector('nav button.active'));
  });
  if (document.fonts) {
    document.fonts.ready.then(() => moveIndicator(document.querySelector('nav button.active')));
  }

  window.addEventListener('resize', () => {
    updateNavMetrics();
    moveIndicator(document.querySelector('nav button.active'));
  });

  /* ── Start ── */
  loadRepos();
  initReveal();
</script>
</body>
</html>
